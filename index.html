<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concentration Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Progress Bar -->
    <div class="progress-bar" id="progress-bar">
        <div class="progress-title">Progress:</div>
        <div class="progress-levels" id="progress-levels">
            <!-- Level indicators will be added here dynamically -->
        </div>
    </div>

    <div class="game-container">
        <div class="level-info">
            <h2>Level: <span id="level-display">1
                <div class="level-tooltip" id="level-tooltip">
                    <div>Wait Time: <span id="tooltip-wait">10.0s</span></div>
                    <div>Display Time: <span id="tooltip-display">1.0s</span></div>
                    <div>Number Length: <span id="tooltip-digits">4</span> digits</div>
                    <div>Animals: <span id="tooltip-animals">0</span></div>
                </div>
            </span></h2>
            <p id="status-message">Get ready...</p>
        </div>

        <div class="circle-container">
            <div id="circle" class="circle">
                <span id="number-display"></span>
            </div>
            <!-- Monkey animations will be added here from level 3+ -->
            <div id="monkey-container" class="monkey-container"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content settings-modal">
            <h2>Game Settings</h2>
            <p class="settings-subtitle">Customize your game difficulty</p>

            <div class="settings-form">
                <div class="setting-item">
                    <label for="wait-time-increase">
                        Wait Time Increase Per Level (%)
                        <span class="setting-help">How much longer you wait for the number each level</span>
                    </label>
                    <input type="number" id="wait-time-increase" min="0" max="100" step="1" value="10">
                </div>

                <div class="setting-item">
                    <label for="display-time-decrease">
                        Display Time Decrease Per Level (%)
                        <span class="setting-help">How much shorter the number appears each level</span>
                    </label>
                    <input type="number" id="display-time-decrease" min="0" max="100" step="1" value="10">
                </div>

                <div class="setting-item">
                    <label for="animal-speed-increase">
                        Animal Speed Increase Per Level (%)
                        <span class="setting-help">How much faster animals move each level</span>
                    </label>
                    <input type="number" id="animal-speed-increase" min="0" max="100" step="1" value="5">
                </div>

                <div class="setting-item">
                    <label for="animal-start-level">
                        Level to Start Adding Animals
                        <span class="setting-help">Which level animals first appear</span>
                    </label>
                    <input type="number" id="animal-start-level" min="1" max="20" step="1" value="3">
                </div>

                <div class="setting-item">
                    <label for="animals-per-interval">
                        Animals Added Every X Levels
                        <span class="setting-help">How often to add more animals (e.g., 3 = every 3 levels)</span>
                    </label>
                    <input type="number" id="animals-per-interval" min="1" max="10" step="1" value="3">
                </div>

                <div class="setting-item">
                    <label for="animals-count-increment">
                        Number of Animals to Add Each Time
                        <span class="setting-help">How many animals to add each interval</span>
                    </label>
                    <input type="number" id="animals-count-increment" min="1" max="10" step="1" value="3">
                </div>
            </div>

            <button id="start-game-btn" class="btn btn-success btn-large">Start Game</button>
        </div>
    </div>

    <!-- Modal for user input -->
    <div id="input-modal" class="modal hidden">
        <div class="modal-content">
            <h2>What was the number?</h2>
            <input type="text" id="user-input" placeholder="Enter the number" autofocus>
            <button id="submit-btn" class="btn">Submit</button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="modal hidden">
        <div class="modal-content celebration">
            <div class="celebration-image">🎉🎊✨</div>
            <h2>Correct!</h2>
            <p>Well done! You remembered the number!</p>
            <button id="next-level-btn" class="btn btn-success">Continue to Next Level</button>
        </div>
    </div>

    <!-- Failure Modal -->
    <div id="failure-modal" class="modal hidden">
        <div class="modal-content failure">
            <div class="failure-image">❌</div>
            <h2>Wrong Answer</h2>
            <p>The correct number was: <span id="correct-number"></span></p>
            <button id="try-again-btn" class="btn btn-retry">Try Again</button>
        </div>
    </div>

    <audio id="clap-sound" preload="auto">
        <source src="clap.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
